[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "soc-operational-twin"
version = "0.1.0"
description = "Fixture-first SoC operational decision twin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "httpx>=0.28",
  "openai>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.35",
]

[project.scripts]
soc-ot = "soc_ot.cli.main:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/soc_ot"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "-ra --strict-markers"
markers = [
  "postgres: requires local PostgreSQL",
  "live: requires an external model provider",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

